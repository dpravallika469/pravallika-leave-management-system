
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Insert Leave | Leave Management System</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<header>
    <h1>Insert Leave Request</h1>
    <p>Add a new employee leave record</p>
</header>

<nav>
    <a href="index.html">Home</a>
    <a href="about.html">About Us</a>
    <a href="list.html">Leave Requests</a>
    <a href="search.html">Search Leave</a>
    <a href="insert.html">Insert Leave</a>
    <a href="update.html">Update Leave</a>
    <a href="delete.html">Delete Leave</a>
</nav>

<main class="hero">
    <h2>Employee Leave Form</h2>

    <form id="leaveForm" style="max-width:500px;margin:25px auto;text-align:left;">

        <label>Employee ID</label>
        <input type="number" id="employeeId" required min="1"
               style="width:100%;padding:12px;margin:8px 0 16px;">

        <label>Employee Name</label>
        <input type="text" id="name" required
               style="width:100%;padding:12px;margin:8px 0 16px;">

        <label>Department</label>
        <input type="text" id="department" required
               style="width:100%;padding:12px;margin:8px 0 16px;">

        <label>Type of Leave</label>
        <select id="leaveType" required
                style="width:100%;padding:12px;margin:8px 0 16px;">
            <option value="">Select leave type</option>
            <option value="Casual Leave">Casual Leave</option>
            <option value="Sick Leave">Sick Leave</option>
            <option value="Earned Leave">Earned Leave</option>
            <option value="Personal Leave">Personal Leave</option>
        </select>

        <label>Number of Days</label>
        <input type="number" id="days" required min="1"
               style="width:100%;padding:12px;margin:8px 0 16px;">

        <label>Description</label>
        <textarea id="description" rows="4"
                  placeholder="Enter reason for leave"
                  style="width:100%;padding:12px;margin:8px 0 16px;"></textarea>

        <button type="submit" class="btn">Save Leave Request</button>
        <p id="message" role="status" style="margin-top:15px;"></p>
    </form>
</main>

<footer>
    <p>Leave Management System</p>
</footer>

<script>
document.getElementById("leaveForm").addEventListener("submit", async function(event) {
    event.preventDefault();

    const message = document.getElementById("message");

    const leave = {
        EMPLOYEE_ID: Number(document.getElementById("employeeId").value),
        NAME: document.getElementById("name").value.trim(),
        DEPARTMENT: document.getElementById("department").value.trim(),
        TYPE_OF_LEAVE: document.getElementById("leaveType").value,
        NUMBER_OF_DAYS: Number(document.getElementById("days").value),
        DESCRIPTION: document.getElementById("description").value.trim()
    };

    try {
        const response = await fetch("/leaves", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify(leave)
        });

        const result = await response.json();

        if (!response.ok) {
            throw new Error(result.error || result.message || "Unable to save leave");
        }

        message.textContent = "Leave request saved successfully!";
        message.style.color = "green";
        this.reset();
    } catch (error) {
        message.textContent = error.message;
        message.style.color = "red";
    }
});
</script>

</body>
</html>
